<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="coding2.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div class="top-empty"></div>
    <div class="main">
        <div class="left">
            <div class="logo-space">
                <img class="logo" src="images/odin-lined.png">
                <div class="logo-text">ODIN</div>
            </div>
        </div>
        <div class="rigth">
            <div class="top">
                <div class="top-text">
                    This is not a real online service! You know you need something like this in your life to help you realize your deppest dreams.<br>
                    Sign up <em>now</em> to get started.
                </div>
                <div class="top-tex">
                    You <em>know</em> you want to.
                </div>
            </div>
            <div class="middle">
                <div class="let">Let's do this!</div>
                <div class="grid">
                    <div class="input">
                        <label for="first_name">FIRST NAME</label>
                        <input id="first_name" name="first_name">
                    </div>
                    <div class="input">
                        <label for="last_name">LAST NAME</label>
                        <input id="last_name" name="last_name">
                    </div>
                    <div class="input">
                        <label for="email">EMAIL</label>
                        <input type="email" id="email" name="email">
                    </div>
                    <div class="input">
                        <label for="telefon">PHONE NUMBER</label>
                        <input type="tel" id="telefon" name="telefon">
                    </div>
                    <div class="input" >
                        <label for="password">PASSWORD</label>
                        <input type="password" id="password" name="password" minlength="4" required>
                    </div>
                    <div class="input">
                        <label for="con_password">CONFIRM PASSWORD</label>
                        <input type="password" id="con_password" name="con_password" minlength="4" required>
                    </div>
                </div>
            </div>
            <div class="bottom">
                <button onclick="window.location.href='t.html'">Create Account</button>
                <div>Already have an account? <a target="_blank" rel="noopener noreferrer" href="https://share.google/IoOSsnfGDaMKhKfjL">Log in</a></div>
            </div>
        </div>
    </div>
    <div class="bottom-empty"></div>
</body>
</html>
